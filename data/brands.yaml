# Protected brands, grouped into scam categories (SCOPE.md).
# official_domains are REGISTRABLE domains (Public Suffix List) and are matched exactly,
# never by substring or prefix, so turbotax.com.evil.net or irs.gov-refund.com never match.
# boundary_tokens only match as whole words: "irs" must not fire on "first" or "shirts",
# and "intuit" must not fire on "intuition".
#
# Adding a category: define it here, add its brands with sources, add trusted facts to
# facts.yaml, its phrases to keywords.yaml, and labeled samples (with `category`) to
# data/eval/samples.jsonl. Report its metrics separately before relying on it.

categories:
  tax:
    description: >-
      Tax-season impersonation: refund holds, identity verification, balance-due and
      payment demands, account suspension, posing as the IRS or tax-software companies.
  delivery:
    description: >-
      Package-delivery smishing: "package on hold" or "incomplete address" lures that push
      a lookalike link, a small redelivery fee, or card details.
  bank:
    description: >-
      Bank impersonation: fake fraud alerts and "confirm this charge" texts that push a
      lookalike sign-in page, ask for one-time codes or passwords, or talk you into
      moving money "to protect it" (often to yourself through Zelle).
  account_takeover:
    description: >-
      Account takeover: fake sign-in alerts, "your password expires today" and "your
      account will be deleted" notices that push a lookalike sign-in page or ask for the
      password or a one-time code of the email and cloud accounts that reset everything else.
  tech_support:
    description: >-
      Tech-support scams: fake virus warnings, locked-computer pop-ups and "call this
      number" alerts posing as Microsoft, which end in remote access, a password or card
      request, or payment for "support" in gift cards or cryptocurrency.
  job:
    description: >-
      Job scams: fake recruiters and offers, often in a real company's name, that ask for
      an upfront fee, payment for equipment, or an SSN, ID photo or bank details before
      any real interview.

brands:
  - name: IRS
    category: tax
    tokens: [irs]
    boundary_tokens: [irs]
    official_domains: [irs.gov]
    sources: [https://www.irs.gov/]

  # "intuit" (the parent company) is a token of both Intuit brands; a match is reported
  # under the first brand that lists it.
  - name: TurboTax
    category: tax
    tokens: [turbotax, intuit]
    boundary_tokens: [intuit]
    official_domains: [turbotax.com, intuit.com]
    sources: [https://turbotax.intuit.com/]

  - name: QuickBooks
    category: tax
    tokens: [quickbooks, intuit]
    boundary_tokens: [intuit]
    official_domains: [quickbooks.com, intuit.com]
    sources: [https://quickbooks.intuit.com/]

  - name: Credit Karma
    category: tax
    tokens: [creditkarma]
    official_domains: [creditkarma.com]
    sources: [https://www.creditkarma.com/]

  # uspis.gov is the U.S. Postal Inspection Service, USPS's law-enforcement arm.
  - name: USPS
    category: delivery
    tokens: [usps]
    official_domains: [usps.com, uspis.gov]
    sources: [https://www.usps.com/, https://www.uspis.gov/]

  # "chase" is an ordinary word: whole-word only ("purchase" is not Chase), and never
  # matched by edit distance ("phase" and "chose" are one letter away).
  - name: Chase
    category: bank
    tokens: [chase]
    boundary_tokens: [chase]
    no_typo_tokens: [chase]
    official_domains: [chase.com]
    sources: [https://www.chase.com/]

  # bofa.com is Bank of America's own reporting domain (abuse@bofa.com).
  - name: Bank of America
    category: bank
    tokens: [bankofamerica, bofa]
    boundary_tokens: [bofa]
    official_domains: [bankofamerica.com, bofa.com]
    sources: [https://www.bankofamerica.com/]

  - name: Wells Fargo
    category: bank
    tokens: [wellsfargo]
    official_domains: [wellsfargo.com]
    sources: [https://www.wellsfargo.com/]

  # Google's other services (googleapis.com, googleusercontent.com, country sites such as
  # google.co.uk) aren't listed: anyone can host pages on the first two, and the country
  # sites would need a sourced list. Links to them score as unofficial.
  - name: Google
    category: account_takeover
    tokens: [google, gmail]
    official_domains: [google.com, gmail.com]
    sources: [https://www.google.com/]

  # "apple" is an ordinary word: whole word only ("pineapple" is not Apple), and never
  # matched by edit distance ("apply" and "ample" are one letter away). "appleid" is its
  # own token because "id" is too short to be a stuffing keyword.
  - name: Apple
    category: account_takeover
    tokens: [apple, appleid, icloud]
    boundary_tokens: [apple]
    no_typo_tokens: [apple]
    official_domains: [apple.com, icloud.com]
    sources: [https://www.apple.com/]

  # "outlook" is an ordinary word ("the weather outlook"), so it's whole word only and
  # never matched by edit distance. live.com hosts Microsoft account sign-in
  # (login.live.com), microsoftonline.com work and school sign-in.
  - name: Microsoft
    category: tech_support
    tokens: [microsoft, outlook, hotmail, onedrive]
    boundary_tokens: [outlook]
    no_typo_tokens: [outlook]
    official_domains:
      [microsoft.com, live.com, outlook.com, office.com, microsoftonline.com, hotmail.com]
    sources: [https://www.microsoft.com/]

  # "indeed" is an ordinary word ("Indeed, the meeting moved"), so it's whole word only,
  # never matched by edit distance, and only named-company forms count as a mention.
  - name: Indeed
    category: job
    tokens: [indeed]
    boundary_tokens: [indeed]
    no_typo_tokens: [indeed]
    official_domains: [indeed.com]
    sources: [https://www.indeed.com/]
