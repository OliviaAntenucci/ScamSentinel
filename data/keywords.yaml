    - malware detected
    - spyware detected
    - trojan detected
    - trojan virus
    - trojan spyware
    - computer is infected
    - computer has been infected
    - device is infected
    - device has been infected
    - pc is infected
    - computer has been locked
    - computer is locked
    - computer has been blocked
    - computer has been hacked
    - device has been hacked
    - phone has been hacked
    - system has been compromised
    - device has been compromised
    - do not shut down
    - do not restart your computer
    - do not turn off your computer
  job_offer_loss:
    - offer will be withdrawn
    - offer will be rescinded
    - offer will be cancelled
    - given to another candidate
    - offered to another candidate
    - secure your position
    - secure the position
    - lose this opportunity
