# Expected named scenario (E4, data/scenarios.yaml) for each text and email scam sample.
#
# Hand-labeled from the sample's content (what a person would call it), BEFORE the
# scenario rules were written, so the rules are measured against them rather than the
# other way round. "none" means no catalogued scenario fits; the sample should get none.
# URL-only samples have no message, so they get no scenario and aren't listed here.
# Legitimate samples should never get a scenario (scenarios are only reported on
# suspicious or likely-scam results); the eval report counts any that do.
#
# Kept separate from samples.jsonl so labeling never changes split assignment.

