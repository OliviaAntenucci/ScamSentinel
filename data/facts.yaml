# Trusted facts for the verification layer (architecture.md §7).
# Every fact needs a source and a last_reviewed date. Re-check sources before relying on them.

facts:
  # --- tax --------------------------------------------------------------------------

  - id: irs_no_unsolicited_digital_contact
    entity: IRS
    statement: >-
      The IRS does not initiate contact with taxpayers by email, text message, or social
      media to request personal or financial information.
    source: https://www.irs.gov/privacy-disclosure/report-phishing
    last_reviewed: 2026-10-14
    data:
      disallowed_first_contact_channels: [sms, email, social]

  - id: irs_no_unusual_payment_methods
    entity: IRS
    statement: >-
      The IRS does not demand immediate payment by gift card, prepaid debit card,
      cryptocurrency, or wire transfer.
    source: https://www.irs.gov/newsroom/tax-scams-consumer-alerts
    last_reviewed: 2026-10-14
    data:
      disallowed_payment_methods: [gift_card, crypto, wire, zelle, cash_app, venmo]

  - id: irs_official_domains
    entity: IRS
    statement: Official IRS websites are on irs.gov.
    source: https://www.irs.gov/
    last_reviewed: 2026-10-14
    data:
      official_domains: [irs.gov]

  - id: irs_individual_phone
    entity: IRS
    statement: IRS individual taxpayer assistance line.
    source: https://www.irs.gov/help/telephone-assistance
    last_reviewed: 2026-10-14
    data:
      phone_numbers: ["+18008291040"]

  - id: irs_report_phishing
    entity: IRS
    statement: >-
      Send IRS-impersonation emails, and the details of IRS-impersonation texts, to
      phishing@irs.gov.
    source: https://www.irs.gov/privacy-disclosure/report-phishing
    last_reviewed: 2026-10-15
    data:
      report_to: phishing@irs.gov

  # --- delivery ---------------------------------------------------------------------

  - id: usps_no_unrequested_messages_with_links
    entity: USPS
    statement: >-
      USPS does not send text messages or emails unless the customer first requested
      tracking updates, and those messages do not contain a link. USPS does not charge for
      tracking.
    source: https://www.uspis.gov/news/scam-article/smishing
    last_reviewed: 2026-10-15
    data:
      disallowed_first_contact_channels: [sms, email]

  - id: usps_official_domains
    entity: USPS
    statement: Official USPS websites are on usps.com; the Postal Inspection Service is on uspis.gov.
    source: https://www.usps.com/
    last_reviewed: 2026-10-15
    data:
      official_domains: [usps.com, uspis.gov]

  - id: usps_customer_service_phone
    entity: USPS
    statement: USPS customer service (1-800-ASK-USPS) and package tracking lines.
    source: https://www.usps.com/help/contact-us.htm
    last_reviewed: 2026-10-15
    data:
      phone_numbers: ["+18002758777", "+18002221811"]

  - id: usps_report_smishing
    entity: USPS
    statement: Report USPS-related smishing by emailing spam@uspis.gov.
    source: https://www.uspis.gov/news/scam-article/smishing
    last_reviewed: 2026-10-15
    data:
      report_to: spam@uspis.gov

  # TODO(M2): add Intuit (TurboTax/QuickBooks) and Credit Karma facts (official support
  # channels, payment policies) from their published security/phishing pages.
