# Trusted facts for the verification layer (architecture.md §7).
# Every fact needs a source and a last_reviewed date. Re-check sources before relying on them.

facts:
  # --- tax --------------------------------------------------------------------------

  - id: irs_no_unsolicited_digital_contact
    entity: IRS
    statement: >-
      The IRS does not initiate contact with taxpayers by email, text message, or social
      media to request personal or financial information.
    source: https://www.irs.gov/privacy-disclosure/report-phishing
    last_reviewed: 2026-10-14
    data:
      disallowed_first_contact_channels: [sms, email, social]

  - id: irs_no_unusual_payment_methods
    entity: IRS
    statement: >-
      The IRS does not demand immediate payment by gift card, prepaid debit card,
      cryptocurrency, or wire transfer.
    source: https://www.irs.gov/newsroom/tax-scams-consumer-alerts
    last_reviewed: 2026-10-14
    data:
      disallowed_payment_methods: [gift_card, crypto, wire, zelle, cash_app, venmo]

  - id: irs_official_domains
    entity: IRS
    statement: Official IRS websites are on irs.gov.
    source: https://www.irs.gov/
    last_reviewed: 2026-10-14
    data:
      official_domains: [irs.gov]

  - id: irs_individual_phone
    entity: IRS
    statement: IRS individual taxpayer assistance line.
    source: https://www.irs.gov/help/telephone-assistance
    last_reviewed: 2026-10-14
    data:
      phone_numbers: ["+18008291040"]

  - id: irs_report_phishing
    entity: IRS
    statement: >-
      Send IRS-impersonation emails, and the details of IRS-impersonation texts, to
      phishing@irs.gov.
    source: https://www.irs.gov/privacy-disclosure/report-phishing
    last_reviewed: 2026-10-15
    data:
      report_to: phishing@irs.gov

  # --- delivery ---------------------------------------------------------------------

  - id: usps_no_unrequested_messages_with_links
    entity: USPS
    statement: >-
      USPS does not send text messages or emails unless the customer first requested
      tracking updates, and those messages do not contain a link. USPS does not charge for
      tracking.
    source: https://www.uspis.gov/news/scam-article/smishing
    last_reviewed: 2026-10-15
    data:
      disallowed_first_contact_channels: [sms, email]

  - id: usps_official_domains
    entity: USPS
    statement: Official USPS websites are on usps.com; the Postal Inspection Service is on uspis.gov.
    source: https://www.usps.com/
    last_reviewed: 2026-10-15
    data:
      official_domains: [usps.com, uspis.gov]

  - id: usps_customer_service_phone
    entity: USPS
    statement: USPS customer service (1-800-ASK-USPS) and package tracking lines.
    source: https://www.usps.com/help/contact-us.htm
    last_reviewed: 2026-10-15
    data:
      phone_numbers: ["+18002758777", "+18002221811"]

  - id: usps_report_smishing
    entity: USPS
    statement: Report USPS-related smishing by emailing spam@uspis.gov.
    source: https://www.uspis.gov/news/scam-article/smishing
    last_reviewed: 2026-10-15
    data:
      report_to: spam@uspis.gov

  # --- bank -------------------------------------------------------------------------
  # Banks do text and email their customers (fraud alerts, receipts), so unlike the IRS
  # and USPS they get no disallowed_first_contact_channels fact. What they publish is what
  # they never ask for: disallowed_requests lists SensitiveRequest types, optionally
  # limited to the channels the bank's statement names.

  - id: bofa_never_asks_codes_or_passwords
    entity: Bank of America
    statement: >-
      Bank of America may ask you to confirm account activity, but will never ask for your
      password or verification code.
    source: https://web.bankofamerica.com/en/security/library/review-scam-alert
    last_reviewed: 2026-10-15
    data:
      disallowed_requests: [password, mfa_code]

  - id: bofa_never_asks_to_send_money
    entity: Bank of America
    statement: >-
      Bank of America will never ask you to send money to it or anyone else (its Zelle FAQ
      adds: including to yourself).
    source: https://web.bankofamerica.com/en/security/library/review-scam-alert
    last_reviewed: 2026-10-15
    data:
      disallowed_payment_methods: [zelle, wire, gift_card, crypto, cash_app, venmo]

  - id: bofa_official_domains
    entity: Bank of America
    statement: Official Bank of America websites are on bankofamerica.com (and bofa.com).
    source: https://www.bankofamerica.com/
    last_reviewed: 2026-10-15
    data:
      official_domains: [bankofamerica.com, bofa.com]

  - id: bofa_customer_service_phone
    entity: Bank of America
    statement: Bank of America line for reporting suspicious activity on most accounts.
    source: https://web.bankofamerica.com/en/security/report-suspicious-activity
    last_reviewed: 2026-10-15
    data:
      phone_numbers: ["+18004321000"]

  - id: bofa_report_phishing
    entity: Bank of America
    statement: >-
      Forward suspicious emails or texts that use Bank of America's name to abuse@bofa.com.
    source: https://web.bankofamerica.com/en/security/report-suspicious-activity
    last_reviewed: 2026-10-15
    data:
      report_to: abuse@bofa.com

  - id: wells_fargo_never_asks_codes_by_text_or_email
    entity: Wells Fargo
    statement: >-
      Wells Fargo will never ask for your password, PIN, or one-time access codes through
      email or text.
    source: https://www.wellsfargo.com/privacy-security/fraud/report/phish/
    last_reviewed: 2026-10-15
    data:
      disallowed_requests: [password, mfa_code]
      channels: [sms, email]

  - id: wells_fargo_official_domains
    entity: Wells Fargo
    statement: Official Wells Fargo websites are on wellsfargo.com.
    source: https://www.wellsfargo.com/
    last_reviewed: 2026-10-15
    data:
      official_domains: [wellsfargo.com]

  - id: wells_fargo_fraud_phone
    entity: Wells Fargo
    statement: Wells Fargo fraud line, for anyone who responded to a suspicious message.
    source: https://www.wellsfargo.com/privacy-security/fraud/report/phish/
    last_reviewed: 2026-10-15
    data:
      phone_numbers: ["+18668675568"]

  - id: wells_fargo_report_phishing
    entity: Wells Fargo
    statement: Forward suspicious emails and texts claiming to be from Wells Fargo to reportphish@wellsfargo.com.
    source: https://www.wellsfargo.com/privacy-security/fraud/report/phish/
    last_reviewed: 2026-10-15
    data:
      report_to: reportphish@wellsfargo.com

  # Chase's security pages (reviewed 2026-10-15) only say "legitimate banks" don't ask
  # you to move money, not Chase specifically, so Chase has no request or payment policy
  # facts yet. Add them only from a statement Chase itself publishes.
  - id: chase_official_domains
    entity: Chase
    statement: Official Chase websites are on chase.com.
    source: https://www.chase.com/
    last_reviewed: 2026-10-15
    data:
      official_domains: [chase.com]

  - id: chase_fraud_phone
    entity: Chase
    statement: Chase line for reporting fraud on personal checking, savings and debit cards.
    source: https://www.chase.com/digital/resources/privacy-security/security/report-fraud
    last_reviewed: 2026-10-15
    data:
      phone_numbers: ["+18009359935"]

  - id: chase_report_phishing
    entity: Chase
    statement: Forward suspicious emails claiming to be from Chase to phishing@chase.com.
    source: https://www.chase.com/digital/resources/privacy-security/security/report-fraud
    last_reviewed: 2026-10-15
    data:
      report_to: phishing@chase.com

  # TODO(M2): add Intuit (TurboTax/QuickBooks) and Credit Karma facts (official support
  # channels, payment policies) from their published security/phishing pages.
