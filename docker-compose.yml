name: scamsentinel

# Shared container hardening (SECURITY.md T3/T4).
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=64m"]

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    <<: *hardening
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container uvicorn must listen on all interfaces so the port
      # mapping works; the mapping below publishes it on the host's loopback only.
      SCAMSENTINEL_HOST: 0.0.0.0
      SCAMSENTINEL_ALLOW_NON_LOOPBACK_BIND: "true"
      SCAMSENTINEL_SANDBOX_URL: http://sandbox:8100
      SCAMSENTINEL_OCR_URL: http://ocr:8200
      TLDEXTRACT_CACHE: /tmp/tldextract
    ports:
      - "127.0.0.1:8000:8000" # localhost only (NFR-9)
    volumes:
      - ./var:/app/var
    networks: [public, sandbox_ctl, ocr_net]
    mem_limit: 1g
    pids_limit: 256

  # Headless Chromium. Reaches the internet only through egress-proxy.
  # TODO(M5): Chromium sandbox seccomp profile; authenticate api<->sandbox calls.
  sandbox:
    build: { context: ., dockerfile: docker/sandbox.Dockerfile }
    <<: *hardening
    tmpfs: ["/tmp:size=256m"]
    shm_size: 512m
    environment:
      SCAMSENTINEL_EGRESS_PROXY: http://egress-proxy:3128
    networks: [sandbox_ctl, sandbox_egress]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 512

  # Second line of SSRF defense: refuses private, loopback, link-local and metadata ranges.
  egress-proxy:
    build: { context: docker/egress-proxy }
    networks: [sandbox_egress, public]
    mem_limit: 256m

  # Image decoding + OCR. Internal network only: no internet access.
  ocr:
    build: { context: ., dockerfile: docker/ocr.Dockerfile }
    <<: *hardening
    networks: [ocr_net]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  # Certificate Transparency poller. Opt in with: docker compose --profile ct up
  ct-watcher:
    profiles: [ct]
    build: { context: ., dockerfile: docker/api.Dockerfile }
    <<: *hardening
    command: ["python", "-m", "scamsentinel.ct"]
    environment:
      TLDEXTRACT_CACHE: /tmp/tldextract
    volumes:
      - ./var:/app/var
    networks: [public]
    mem_limit: 256m

networks:
  public: {}
  sandbox_ctl: { internal: true }
  sandbox_egress: { internal: true }
  ocr_net: { internal: true }
