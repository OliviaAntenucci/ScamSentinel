[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scamsentinel"
version = "0.1.0"
description = "Explainable detector for tax-season scams impersonating TurboTax, QuickBooks, Credit Karma and the IRS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tldextract>=5.1",
    "idna>=3.10",
    "rapidfuzz>=3.10",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Keep in sync with the base image tag in docker/sandbox.Dockerfile.
sandbox = ["playwright==1.49.1"]
ocr = ["pillow>=11.0", "pytesseract>=0.3.13"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["scamsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
