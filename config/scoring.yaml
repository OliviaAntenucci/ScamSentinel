# Scoring configuration (architecture.md §9). Tune on the DEV split only, never on test.

# Renormalized over the modules that actually ran.
weights:
  domain: 0.55
  message: 0.45

# 0-29 likely_legitimate, 30-59 suspicious, 60-100 likely_scam
bands:
  suspicious: 30
  likely_scam: 60

# Minimum score when a high-confidence combination fires.
floors:
  sensitive_request_with_lookalike: 90
  irs_unusual_payment_demand: 85
  homoglyph_brand_domain: 80
  impersonation_with_lookalike: 80 # claims brand X and links to an X lookalike (added after dev eval)
  brand_sensitive_request: 75 # claims a protected brand and asks for SSN/card/password/... (dev eval)
  injection_plus_scam_signal: 70

# Max score when every URL is official and nothing sensitive or payment-related is requested.
mitigating_cap: 40

# Domain engine technique points (architecture.md §4).
domain_points:
  exact_brand_unofficial: 70
  homoglyph: 85
  typosquat_min: 60
  typosquat_max: 80
  brand_plus_keywords_base: 50
  brand_plus_keywords_per_keyword: 10
  brand_plus_keywords_cap: 90
  brand_in_subdomain: 75
  brand_in_label: 50 # brand token plus unrecognized words, e.g. myturbotaxfiling.com
  tld_swap: 65
  idn_mixed_script_bonus: 15
  new_registration_bonus: 10 # not applied yet: needs RDAP/certificate-age enrichment

# Message signal points (architecture.md §5). The message score is the sum, clamped to 0-100.
message_points:
  impersonation: 20
  urgency_high: 15 # urgency level >= 7
  urgency_medium: 10 # level >= 4
  urgency_low: 5 # level >= 1
  sensitive_request: 25 # per kind of data requested
  sensitive_request_cap: 50
  unusual_payment_method: 30
  threat: 10 # per kind of threat
  threat_cap: 20
  call_to_action: 5
  injection_attempt: 30

# Verification points (architecture.md §6), added to the message score.
# Negative values are mitigating evidence.
verify_points:
  official_domain_mismatch: 20
  official_domain_match: -15
  contact_channel: 25
  payment_method_policy: 25
  phone_number_unknown: 10
  sender_brand_mismatch: 25
  reply_to_mismatch: 15
  sender_verified: -10
